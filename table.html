<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Custom Table</title>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f7f8f9;
      color: #172b4d;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    input,
    select,
    button {
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid #dfe1e6;
      border-radius: 4px;
      background: #ffffff;
      font-size: 14px;
    }

    input {
      width: 280px;
    }

    button {
      cursor: pointer;
    }

    #authoriseBox {
      margin-bottom: 16px;
      padding: 18px;
      background: #ffffff;
      border: 1px solid #dfe1e6;
      border-radius: 6px;
    }

    #authoriseBox p {
      margin-top: 0;
    }

    .hidden {
      display: none;
    }

    .table-wrap {
      background: white;
      border: 1px solid #dfe1e6;
      border-radius: 6px;
      overflow: auto;
      max-height: calc(100vh - 125px);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 1000px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f1f2f4;
      text-align: left;
      padding: 10px;
      border-bottom: 2px solid #dfe1e6;
      white-space: nowrap;
      cursor: pointer;
    }

    th:hover {
      background: #e4e6ea;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #ebecf0;
      vertical-align: top;
    }

    tbody tr:hover {
      background: #f7f8f9;
    }

    .card-link {
      font-weight: 600;
      text-decoration: none;
      color: #0c66e4;
    }

    .label {
      display: inline-block;
      margin: 1px 3px 1px 0;
      padding: 3px 6px;
      border-radius: 3px;
      background: #dfe1e6;
      font-size: 12px;
    }

    .count {
      margin-left: auto;
      color: #626f86;
    }

    .status {
      padding: 20px;
    }
  </style>

</head>

<body>

  <div id="authoriseBox" class="hidden">
    <p>
      This table needs read-only access to your Trello board
      so it can retrieve Custom Field definitions.
    </p>

    <button id="authoriseButton">
      Authorise Custom Table
    </button>
  </div>

  <div id="app" class="hidden">

    <div class="toolbar">

      <input
        id="searchInput"
        type="search"
        placeholder="Search cards..."
      >

      <select id="listFilter">
        <option value="">All Lists</option>
      </select>

      <span id="customFilters"></span>

      <button id="clearButton">
        Clear Filters
      </button>

      <span
        id="count"
        class="count"
      ></span>

    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr id="header"></tr>
        </thead>

        <tbody id="body"></tbody>

      </table>

    </div>

  </div>

  <div
    id="loading"
    class="status"
  >
    Loading...
  </div>

  <script src="./table.js"></script>

</body>
</html>
