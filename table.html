<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Detailed Table</title>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <style>
    :root {
      --text: #172b4d;
      --subtle-text: #626f86;
      --border: #dfe1e6;
      --border-light: #ebecf0;
      --header: #f7f8f9;
      --hover: #f7f8f9;
      --background: #ffffff;
      --control-background: #ffffff;

      --risk-background: #fff1f0;
      --risk-border: #f15b50;

      --overdue-background: #ffebe6;
      --overdue-text: #ae2a19;

      --soon-background: #fff7d6;
      --soon-text: #7f5f01;

      --status-good: #216e4e;
      --status-risk: #ae2a19;
      --status-neutral: #626f86;

      --blue: #0c66e4;
      --blue-hover: #0055cc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;

      background: var(--background);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 14px;
      line-height: 20px;
    }

    .page {
      padding: 16px 20px 20px;
    }

    /* =====================================================
       TOOLBAR
       ===================================================== */

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;

      margin-bottom: 14px;
    }

    .toolbar input,
    .toolbar select,
    .toolbar button {
      height: 34px;

      border: 1px solid var(--border);
      border-radius: 3px;

      background: var(--control-background);
      color: var(--text);

      font: inherit;

      padding: 6px 9px;
    }

    .toolbar input {
      width: 230px;
    }

    .toolbar select {
      min-width: 145px;
      max-width: 220px;
    }

    .toolbar button {
      cursor: pointer;
      font-weight: 500;
    }

    .toolbar button:hover {
      background: var(--header);
    }

    .count {
      margin-left: auto;
      color: var(--subtle-text);
      white-space: nowrap;
    }

    /* =====================================================
       MULTI SELECT FILTER
       ===================================================== */

    .multi-filter {
      position: relative;
      display: inline-block;
    }

    .multi-filter-button {
      min-width: 145px;
      max-width: 210px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      white-space: nowrap;
    }

    .multi-filter-button.active {
      border-color: var(--blue);
      color: var(--blue);
    }

    .multi-filter-arrow {
      font-size: 10px;
      color: var(--subtle-text);
    }

    .multi-filter-menu {
      position: absolute;
      z-index: 50;

      top: calc(100% + 4px);
      left: 0;

      width: 260px;
      max-height: 360px;

      display: none;

      overflow: hidden;

      background: #ffffff;

      border: 1px solid var(--border);
      border-radius: 6px;

      box-shadow:
        0 8px 12px rgba(9, 30, 66, 0.15),
        0 0 1px rgba(9, 30, 66, 0.31);
    }

    .multi-filter.open .multi-filter-menu {
      display: block;
    }

    .multi-filter-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;

      padding: 8px;

      border-bottom: 1px solid var(--border-light);
    }

    .multi-filter-actions button {
      height: 28px;
      padding: 3px 8px;

      border: 0;

      color: var(--blue);
      background: transparent;

      font-size: 12px;
    }

    .multi-filter-actions button:hover {
      color: var(--blue-hover);
      background: var(--header);
    }

    .multi-filter-options {
      max-height: 285px;
      overflow-y: auto;

      padding: 4px 0;
    }

    .multi-filter-option {
      display: flex;
      align-items: center;
      gap: 8px;

      min-height: 34px;

      padding: 6px 10px;

      cursor: pointer;

      color: var(--text);
    }

    .multi-filter-option:hover {
      background: var(--header);
    }

    .multi-filter-option input {
      width: 16px;
      height: 16px;

      margin: 0;
      padding: 0;
    }

    .multi-filter-option span {
      flex: 1;
    }

    /* =====================================================
       TABLE
       ===================================================== */

    .table-wrap {
      width: 100%;
      overflow: auto;

      border: 1px solid var(--border);
      border-radius: 3px;

      max-height: calc(100vh - 85px);

      background: #ffffff;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;

      width: 100%;
      min-width: 1180px;

      table-layout: auto;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 5;

      background: var(--header);
      color: var(--subtle-text);

      font-size: 12px;
      font-weight: 600;
      text-align: left;

      padding: 8px 10px;

      border-bottom: 1px solid var(--border);

      white-space: nowrap;

      cursor: pointer;
      user-select: none;
    }

    th:hover {
      background: #f1f2f4;
      color: var(--text);
    }

    td {
      height: 48px;

      padding: 8px 10px;

      vertical-align: middle;

      border-bottom: 1px solid var(--border-light);

      background: #ffffff;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover td {
      background: var(--hover);
    }

    tbody tr.at-risk td {
      background: var(--risk-background);
    }

    tbody tr.at-risk:hover td {
      background: #ffeceb;
    }

    tbody tr.at-risk td:first-child {
      box-shadow:
        inset 3px 0 0 var(--risk-border);
    }

    /* =====================================================
       CARD LINKS
       ===================================================== */

    .card-button {
      color: var(--text);

      font: inherit;
      font-weight: 500;

      text-align: left;
      text-decoration: none;

      cursor: pointer;
    }

    .card-button:hover {
      text-decoration: underline;
    }

    /* =====================================================
       LABELS
       ===================================================== */

    .label-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;

      align-items: center;
    }

    .trello-label {
      display: inline-flex;
      align-items: center;

      min-height: 22px;

      padding: 2px 7px;

      border-radius: 3px;

      font-size: 12px;
      font-weight: 500;
      line-height: 18px;

      white-space: nowrap;
    }

    /* =====================================================
       MEMBERS
       ===================================================== */

    .member-stack {
      display: flex;
      align-items: center;

      min-width: 60px;
    }

    .member-avatar,
    .member-initials {
      width: 28px;
      height: 28px;

      border-radius: 50%;

      margin-left: -5px;

      border: 2px solid #ffffff;

      object-fit: cover;

      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .member-stack > :first-child {
      margin-left: 0;
    }

    .member-initials {
      background: #dfe1e6;
      color: #172b4d;

      font-size: 10px;
      font-weight: 700;
    }

    /* =====================================================
       DATES
       ===================================================== */

    .date-cell {
      white-space: nowrap;
    }

    .date-note {
      display: inline-block;

      margin-left: 5px;
      padding: 1px 5px;

      border-radius: 3px;

      font-size: 11px;
      font-weight: 600;
    }

    .overdue {
      background: var(--overdue-background);
      color: var(--overdue-text);
    }

    .due-soon {
      background: var(--soon-background);
      color: var(--soon-text);
    }

    /* =====================================================
       STATUS / VARIANCE
       ===================================================== */

    .status {
      font-weight: 600;
      white-space: nowrap;
    }

    .status-on-track {
      color: var(--status-good);
    }

    .status-risk {
      color: var(--status-risk);
    }

    .status-neutral {
      color: var(--status-neutral);
    }

    .variance-positive {
      color: var(--status-risk);
      font-weight: 600;
    }

    .variance-negative {
      color: var(--status-good);
      font-weight: 600;
    }

    /* =====================================================
       STATES
       ===================================================== */

    .empty-state,
    .loading,
    .error {
      padding: 30px;

      text-align: center;

      color: var(--subtle-text);
    }

    .error {
      color: var(--status-risk);
    }
  </style>

</head>

<body>

  <div class="page">

    <div
      id="toolbar"
      class="toolbar"
      hidden
    >

      <input
        id="searchInput"
        type="search"
        placeholder="Search cards..."
      >

      <div id="listFilter"></div>

      <div id="labelFilter"></div>

      <div id="memberFilter"></div>

      <div id="statusFilter"></div>

      <span id="customFilters"></span>

      <button
        id="clearButton"
        type="button"
      >
        Clear Filters
      </button>

      <span
        id="count"
        class="count"
      ></span>

    </div>


    <div
      id="loading"
      class="loading"
    >
      Loading Detailed Table...
    </div>


    <div
      id="tableWrap"
      class="table-wrap"
      hidden
    >

      <table>

        <thead>
          <tr id="header"></tr>
        </thead>

        <tbody id="body"></tbody>

      </table>

    </div>

  </div>

  <script src="./table.js"></script>

</body>

</html>
